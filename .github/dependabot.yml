# Keeps the workflows' SHA-pinned actions current: one pull request per update, with the new
# commit SHA and its release in the trailing comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # The gtk-rs crates release in lockstep and require matching versions of each other
    # (gio 0.22.10 does not build against gio-sys 0.22.8), so they update together.
    groups:
      gtk-rs:
        patterns:
          - "glib*"
          - "gio*"
          - "gtk4*"
          - "gdk4*"
          - "gsk4*"
          - "gdk-pixbuf*"
          - "pango*"
          - "cairo*"
          - "graphene*"
          - "libadwaita*"
