name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same checks on the tagged commit before it builds anything.
  workflow_call:

permissions:
  contents: read

# One run per branch or PR at a time; a newer push cancels the older run. Called from a release
# the group carries the tag (and differs from the release's own group), so it cancels nothing.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Every action is pinned to a full commit SHA: a tag such as `v3` can be moved to other
      # code, a SHA cannot. The trailing comment names the release the SHA is; the weekly
      # maintenance round updates them (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Toolchain matches rust-toolchain.toml
        run: grep -q '^channel = "1.96.0"$' rust-toolchain.toml && rustc --version | grep -q '^rustc 1\.96\.0 '
      - name: Install GTK4 / libadwaita headers
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev pkg-config
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck -S warning build-appimage.sh scripts/*.sh scripts/tests/*.sh
      # The install script's tests run it unprivileged in a bubblewrap sandbox, which needs an
      # unprivileged user namespace; Ubuntu 24.04 confines those with AppArmor by default.
      # This runner VM is thrown away afterwards.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq bubblewrap acl
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install script tests
        run: scripts/tests/privileged-install-test.sh
      - name: AppStream releases match the changelog
        run: python3 scripts/sync_appdata_releases.py --check && python3 scripts/release_notes.py --self-test && python3 scripts/release_notes.py "$(grep -m1 '^version' Cargo.toml | cut -d\" -f2)" > /dev/null
