name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build AppImage
        run: sudo -E env "PATH=$PATH" bash build-appimage.sh

      # The release page carries this version's changes in full, from CHANGELOG.md: no link to it.
      - name: Release notes from the changelog
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md && cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: green-light-*-x86_64.AppImage*
          body_path: release-notes.md
