name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          cargo_ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "${GITHUB_REF_NAME}" != "v${cargo_ver}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_ver}" >&2
            exit 1
          fi
          python3 scripts/sync_appdata_releases.py --check

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 / libadwaita headers
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Test
        run: cargo test --locked

      - name: Build AppImage
        run: sudo -E env "PATH=$PATH" bash build-appimage.sh

      # The release page carries this version's changes in full, from CHANGELOG.md: no link to it.
      - name: Release notes from the changelog
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md && cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: green-light-*-x86_64.AppImage*
          body_path: release-notes.md
