name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # A test build of a fix branch for the person who reported the issue (AGENTS.md, "Test builds"):
  # the same build, published as a pre-release, never as the latest release.
  workflow_dispatch:
    inputs:
      issue:
        description: The issue number this test build is for
        required: true
        type: number

# Nothing here can write to the repository except the `publish` job, which only downloads the
# build job's files and attaches them to the release. The `build` job runs the whole toolchain
# (cargo, build scripts, apt packages) with a read-only token and no stored git credentials, so
# a compromised dependency has nothing to publish with. Every action is pinned to a full commit
# SHA: a tag such as `v3` can be moved to other code, a SHA cannot. The trailing comment names
# the release the SHA is; the weekly maintenance round updates them (see .github/dependabot.yml).
permissions:
  contents: read

defaults:
  run:
    shell: bash

# One release run per tag; a second push of the same tag waits rather than racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI's checks (tests, clippy, ShellCheck, the install script tests, changelog/appdata) on the
  # tagged commit itself, so a tag can't publish code that hasn't passed them.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Makes a missing or failing zsyncmake fatal in build-appimage.sh (GitHub Actions sets it
      # already; stated here so the build does not depend on that).
      CI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag names the version that is released: refuse a tag that is not the Cargo
      # version before anything is built.
      - name: Tag matches the Cargo version
        if: github.event_name == 'push'
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "error: tag $GITHUB_REF_NAME does not match the Cargo version $version" >&2
              exit 1
          fi

      # The release page carries this version's changes in full, from CHANGELOG.md: no link to it.
      # The release fails here, before the build, when the section is missing.
      - name: Release notes from the changelog
        run: python3 scripts/release_notes.py "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" > release-notes.md && cat release-notes.md

      # The version in rust-toolchain.toml; keep the two in step (the build fails on a mismatch).
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Toolchain matches rust-toolchain.toml
        run: grep -q '^channel = "1.96.0"$' rust-toolchain.toml && rustc --version | grep -q '^rustc 1\.96\.0 '

      # The GTK headers the build needs and the packaging tools build-appimage.sh uses. This is
      # the only privileged step: the AppImage build below runs as the runner user.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev pkg-config \
            zsync wget file desktop-file-utils

      - name: Build AppImage
        run: bash build-appimage.sh

      - name: Check the release files
        run: |
          appimage="$(ls green-light-*-x86_64.AppImage)"
          test -s "$appimage"
          test -s "$appimage.zsync"
          ls -l "$appimage" "$appimage.zsync"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            green-light-*-x86_64.AppImage
            green-light-*-x86_64.AppImage.zsync
            release-notes.md
          if-no-files-found: error

  # The only job with write access, and it runs no project code: it attaches what `build` made.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            green-light-*-x86_64.AppImage
            green-light-*-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
          body_path: release-notes.md

      - name: Create the test build (a pre-release)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: test-${{ github.ref_name }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Test build for #${{ inputs.issue }} (${{ github.ref_name }})"
          prerelease: true
          make_latest: false
          files: |
            green-light-*-x86_64.AppImage
            green-light-*-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
          body: |
            **Not a release.** A test build of the branch `${{ github.ref_name }}` (commit ${{ github.sha }}) for issue #${{ inputs.issue }}, so the fix can be tried before it is released. Install it like a release; please say in the issue whether it fixes the problem. Once the fix is released, update to that release; this test build is then deleted. The version number is the one the fix will be released as.
