[package]
name = "greenlight"
version = "2.7.3"
edition = "2021"
description = "GreenLight — GTK4 GUI for installing NVIDIA drivers on Linux"
authors = ["Alex Brown"]
license = "AGPL-3.0-or-later"

[[bin]]
name = "greenlight"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_4", "v1_5"] }
glib = "0.22"
gio = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
scraper = "0.27"
regex = "1"
anyhow = "1"

[profile.release]
opt-level = 3
strip = true
lto = true
