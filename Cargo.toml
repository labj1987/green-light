[package]
name = "green-light"
version = "2.12.2"
edition = "2021"
rust-version = "1.100"
description = "Green Light — a GUI for installing NVIDIA drivers on Linux"
authors = ["Linnard Alex Brown Jr."]
license = "AGPL-3.0-or-later"

[[bin]]
name = "green-light"
path = "src/main.rs"

[dependencies]
# The UI toolkit: GPUI Kit (GPUI + gpui-base + gpui-component + default icons).
gpui-kit = "=0.9.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
sha2 = "0.11"
hex = "0.4"
futures-util = "0.3"
# The desktop's accent colour (accent.rs), from the XDG desktop portal: the portal client the toolkit
# already uses for its file dialogs and light/dark setting, with the same features.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
scraper = "0.29"
regex = "1"
anyhow = "1"
serde_json = "1"
# The user's Downloads folder (XDG_DOWNLOAD_DIR from ~/.config/user-dirs.dirs).
dirs = "6"
libc = "0.2"
log = "0.4"
# Raising the window for a second launch (activation.rs): the request goes out on GPUI's own
# Wayland connection, so these are the versions and the system-library backend GPUI uses.
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.cargo]
unused_dependencies = "warn"
